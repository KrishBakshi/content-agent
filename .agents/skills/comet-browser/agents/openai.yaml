interface:
  display_name: "Comet Browser"
  short_description: "Browser navigation and live research with comet-mcp"
  default_prompt: "Use $comet-browser to navigate the relevant site in Comet browser, inspect the live pages, and return concise findings with source links."

dependencies:
  tools:
    - type: "mcp"
      value: "comet-mcp"
      description: "Live web search, browsing, and page inspection"

policy:
  allow_implicit_invocation: true
